<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Order request</title></head>
<body><form name="biryani-order" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="biryani-order">
<input name="bot-field"><input name="reference"><input name="name"><input name="phone"><input name="email">
<input name="people"><input name="meat"><input name="notes">
<input name="deliveryAddress"><input name="foodSubtotal"><input name="deliveryFee">
<!-- Legacy fields preserve earlier submission history. -->
<input type="hidden" name="size"><input type="hidden" name="spice"><input type="hidden" name="estimatedTotal">
</form>
<form name="odb-customer-review" method="POST" data-netlify="true" netlify-honeypot="review-bot" hidden>
<input type="hidden" name="form-name" value="odb-customer-review">
<input name="review-bot"><input name="submissionRef"><input name="reviewerName"><input name="orderPhone">
<input name="rating"><textarea name="reviewText"></textarea><input name="publicationConsent">
</form>
<form name="odb-order-request" method="POST" data-netlify="true" netlify-honeypot="order-bot" hidden>
<input type="hidden" name="form-name" value="odb-order-request">
<input name="order-bot"><input name="reference"><input name="customerName"><input name="customerEmail"><input name="email"><input name="customerPhone">
<input name="people"><input name="meat"><input name="chickenCut"><input name="requestedDate"><input name="requestedTime">
<input name="fulfillment"><textarea name="deliveryAddress"></textarea><input name="foodSubtotal"><input name="deliveryFee"><input name="depositPercent"><input name="contactConsent">
</form></body></html>
